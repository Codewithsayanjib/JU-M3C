name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run the leakage audit on the toy dataset
        run: jumc audit --train tests/fixtures/toy_train.jsonl --test tests/fixtures/toy_test.jsonl
      - name: Tests
        run: pytest -q
